<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b10">
  <title>Panda Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">PANDA <span>LIVE</span></a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search live channels...">
    </div>
    <button id="refreshBtn" class="refresh">↻ Refresh</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-filter="all">All Live</button>
    <button class="tab" data-filter="popular">Popular</button>
    <button class="tab" data-filter="new">New</button>
  </nav>

  <main>
    <section class="hero">
      <div>
        <span class="live-pill">● LIVE NOW</span>
        <h1>Watch live channels</h1>
        <p>Responsive live directory for mobile and desktop.</p>
      </div>
    </section>

    <div class="section-head">
      <h2>🔴 Live Channels</h2>
      <span id="status">Loading...</span>
    </div>

    <section id="grid" class="grid"></section>
    <div id="empty" class="empty hidden">No channels found.</div>
  </main>

  <footer>© 2026 Panda Live Directory</footer>
  <script src="app.js"></script>
</body>
</html>
