
<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload Video</title><style>

body{
margin:0;
background:#0f172a;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.card{
width:420px;
background:#1e293b;
padding:25px;
border-radius:20px;
text-align:center;
}

.upload{
border:2px dashed #38bdf8;
padding:30px;
border-radius:15px;
margin-bottom:15px;
}

input[type=file]{
width:100%;
}

button{
background:#38bdf8;
border:none;
padding:12px 20px;
color:#fff;
border-radius:10px;
cursor:pointer;
}

.success{
margin-top:20px;
}

.success input{
width:100%;
padding:10px;
box-sizing:border-box;
margin-bottom:10px;
}

</style></head>
<body><div class="card"><h2>🎬 Upload Video</h2><form method="POST" enctype="multipart/form-data"><div class="upload">
<input type="file" name="video" accept="video/*" required>
</div><button type="submit">
📤 Upload
</button></form>
        <div class="success">
            <h3>✅ Upload Berhasil</h3>

            <input type="text" id="link" value="https://pandalive-co.vercel.app/sFmb-XPiw9sN-NxT.mp4" readonly>

            <button onclick="copyLink()">
                📋 Salin Link
            </button>
        </div></div><script>

function copyLink(){

const link=document.getElementById('link');

navigator.clipboard.writeText(link.value);

alert('Link berhasil disalin');

}

</script></body>
</html>
